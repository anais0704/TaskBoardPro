<section class="tasks-card">
  <h2>Liste des tâches</h2>

  <ng-container #highlightContainer></ng-container>

  <button
    type="button"
    class="tasks-card__new-btn"
    (click)="showForm = !showForm"
  >
    {{ showForm ? 'Fermer le formulaire' : 'Nouvelle tâche' }}
  </button>

  <div class="tasks-card__form" *ngIf="showForm">
    <input
      #taskTitleInput
      type="text"
      placeholder="Titre de la tâche"
      (keyup.enter)="addTask(taskTitleInput.value, taskDescInput.value); taskTitleInput.value = ''; taskDescInput.value = ''"
    />
    <textarea
      #taskDescInput
      placeholder="Description de la tâche"
      (keyup.enter)="addTask(taskTitleInput.value, taskDescInput.value); taskTitleInput.value = ''; taskDescInput.value = ''"
    ></textarea>
    <button
      type="button"
      (click)="addTask(taskTitleInput.value, taskDescInput.value); taskTitleInput.value = ''; taskDescInput.value = ''"
    >
      Enregistrer
    </button>
  </div>

  <div class="task-filters">
    <button (click)="filter = 'all'" [class.active]="filter === 'all'">Toutes</button>
    <button (click)="filter = 'active'" [class.active]="filter === 'active'">En cours</button>
    <button (click)="filter = 'completed'" [class.active]="filter === 'completed'">Terminées</button>
  </div>

  <ng-container *ngIf="filteredTasks$ | async as tasks; else loading">
    <ul>
      <li *ngFor="let task of tasks; let i = index; trackBy: trackByTaskId" [class.completed]="isTaskCompleted(task)">
        <div class="task-row">
          <div class="task-content">
            <strong>{{ task.title }}</strong>
            <p>{{ task.description }}</p>
          </div>
          <div class="task-actions">
            <button
              type="button"
              class="task-highlight-btn"
              (click)="highlightTask(task)"
            >
              Mettre en avant
            </button>
            <button
              type="button"
              class="task-highlight-btn"
              (click)="editTask(task, i)"
            >
              Éditer
            </button>
            <input
              type="checkbox"
              [checked]="isTaskCompleted(task)"
              (change)="toggleTask(task)"
              class="task-checkbox"
            />
            <button
              type="button"
              (click)="removeTask(task.id)"
              class="task-delete"
              aria-label="Supprimer la tâche"
              title="Supprimer"
            >
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4V13.3333C12 13.6869 11.8595 14.0261 11.6095 14.2761C11.3594 14.5262 11.0203 14.6667 10.6667 14.6667H5.33333C4.97971 14.6667 4.64057 14.5262 4.39052 14.2761C4.14048 14.0261 4 13.6869 4 13.3333V4M14.6667 4H1.33333M10.6667 4V2.66667C10.6667 2.31305 10.5262 1.97391 10.2761 1.72386C10.0261 1.47381 9.68696 1.33333 9.33333 1.33333H6.66667C6.31305 1.33333 5.97391 1.47381 5.72386 1.72386C5.47381 1.97391 5.33333 2.31305 5.33333 2.66667V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="task-edit-container">
          <ng-container #editContainer></ng-container>
        </div>
      </li>
    </ul>
  </ng-container>

  <ng-template #loading>
    <p class="tasks-card__loading">Chargement des tâches...</p>
  </ng-template>

  <app-task-stats></app-task-stats>
</section>
